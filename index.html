<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Vital Dari Wajah — rPPG Heart Rate Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/styles.css">
  <!-- ONNX Runtime Web local bundle with CDN fallback -->
  <script src="./js/vendor/ort.min.js"></script>
  <script>
    if (typeof ort === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"><\/script>');
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between py-3 mb-4 border-b border-slate-800/80">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
        </svg>
      </div>
      <div>
        <h1 class="text-base sm:text-lg font-semibold tracking-tight text-slate-100">Cek Vital Dari Wajah</h1>
        <p class="text-xs text-slate-400">In-Browser rPPG Remote Heart Rate Sensing</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <select id="camera-select" class="hidden text-xs bg-slate-900 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-slate-300 focus:outline-none focus:ring-1 focus:ring-emerald-500"></select>
      <button id="mirror-btn" type="button" title="Toggle Mirror View" class="text-xs bg-slate-900 hover:bg-slate-800 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-slate-300 flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        <span>Mirror</span>
      </button>
      <span id="status-badge" class="px-3 py-1 text-xs font-mono font-medium rounded-full border bg-slate-800 text-slate-400 border-slate-700">Loading...</span>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="w-full max-w-4xl flex-1 flex flex-col items-center gap-6">
    
    <!-- Video & Canvas Container -->
    <div class="relative w-full aspect-[4/3] sm:aspect-video rounded-2xl overflow-hidden glass-panel glow-card bg-slate-900 flex items-center justify-center shadow-2xl">
      <!-- Hidden or Background Video -->
      <video id="webcam-video" class="absolute inset-0 w-full h-full object-cover -scale-x-100" playsinline muted autoplay></video>
      
      <!-- Overlay Canvas for Detection Bounding Box, ROIs & Waveforms (NOT flipped via CSS so text stays readable) -->
      <canvas id="overlay-canvas" class="absolute inset-0 w-full h-full object-cover pointer-events-none"></canvas>

      <!-- Empty State / Placeholder -->
      <div id="video-placeholder" class="z-0 flex flex-col items-center justify-center p-6 text-center text-slate-500 gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-slate-600 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <p class="text-sm font-medium">Click "Start Measurement" to open webcam</p>
      </div>
    </div>

    <!-- Quick Stats & Control Bar -->
    <div class="w-full grid grid-cols-1 sm:grid-cols-3 gap-4">
      
      <!-- Metric: Heart Rate -->
      <div class="glass-panel rounded-xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Heart Rate</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span id="bpm-metric" class="text-3xl font-bold font-mono text-rose-500">--</span>
            <span class="text-xs text-slate-400 font-mono">BPM</span>
          </div>
        </div>
        <div class="p-2.5 rounded-lg bg-rose-500/10 text-rose-400 border border-rose-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
      </div>

      <!-- Action Button (Single Prominent Toggle) -->
      <div class="flex items-center justify-center">
        <button id="toggle-btn" disabled class="w-full h-full min-h-[64px] px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium shadow-lg shadow-emerald-950/50 transition-all flex items-center justify-center gap-2.5 text-base active:scale-95">
          <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span id="btn-text">Start Measurement</span>
        </button>
      </div>

      <!-- Metric: Processing FPS -->
      <div class="glass-panel rounded-xl p-4 flex items-center justify-between">
        <div>
          <span class="text-xs font-mono uppercase tracking-wider text-slate-400">Processing Rate</span>
          <div class="flex items-baseline gap-1 mt-0.5">
            <span id="fps-metric" class="text-3xl font-bold font-mono text-emerald-400">--</span>
            <span class="text-xs text-slate-400 font-mono">FPS</span>
          </div>
        </div>
        <div class="p-2.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
      </div>

    </div>

    <!-- Terminal Console Logs (Collapsible Debug Output) -->
    <details class="w-full glass-panel rounded-xl overflow-hidden">
      <summary class="px-4 py-2.5 cursor-pointer text-xs font-mono text-slate-400 hover:text-slate-200 select-none flex items-center justify-between bg-slate-900/50">
        <span>Terminal Execution Log</span>
        <span class="text-[10px] uppercase tracking-wider text-slate-500">Live output</span>
      </summary>
      <div id="terminal-logs" class="p-3 h-28 overflow-y-auto font-mono text-xs bg-black/40 flex flex-col gap-1 border-t border-slate-800">
        <!-- Logs injected here -->
      </div>
    </details>

  </main>

  <!-- Footer -->
  <footer class="w-full max-w-4xl text-center py-4 text-xs text-slate-500 border-t border-slate-900 mt-6 flex items-center justify-between">
    <span>Cek-Vital-Dari-Wajah • Pure Client-Side Static App</span>
    <span class="font-mono">GitHub Pages Ready</span>
  </footer>

  <!-- App Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
